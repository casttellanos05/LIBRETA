<style>
:root {

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font); margin: 0; min-height: 100vh; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand > div { min-width: 0; }
.sync { flex: none; }
.mark { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); color: #fff; display: grid; place-items: center; font: 700 16px var(--font); box-shadow: inset -4px 0 0 var(--accent); flex: none; }
h1 { font: 700 20px/1 var(--font); margin: 0; letter-spacing: -0.03em; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.small { font-size: 12.5px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.btn { font: 500 14px var(--font); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 9px; padding: 8px 14px; cursor: pointer; min-height: 38px; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn.ok { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.big { width: 100%; min-height: 50px; font-size: 16px; font-weight: 600; border-radius: 10px; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); font-size: 12.5px; min-height: 28px; padding: 3px 8px; }
.btn.quiet:hover { color: var(--ink); text-decoration: underline; border-color: transparent; }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.acc { background: var(--violet-soft); color: var(--violet); }
input, select, textarea { font: 15px var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-height: 38px; max-width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: 600 13.5px var(--font); border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
.chip { font: 500 13px var(--font); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 4px 11px; cursor: pointer; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cls { border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px 14px; margin-bottom: 10px; }
.cls.e-impartida { border-left-color: var(--ok); }
.cls.e-cancelada { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad-soft) 35%, var(--card)); }
.cls.e-cambiada { border-left-color: var(--warn); }
.cls.e-pendiente { border-left-color: var(--violet); }
.hora { font: 700 19px/1 var(--font); min-width: 64px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.hora small { display: block; font: 500 12px var(--font); color: var(--muted); margin-top: 2px; }
.gtitle { font: 700 20px/1 var(--font); letter-spacing: -0.03em; }
details { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; max-width: 100%; }
.gridn td, .gridn th { padding: 4px 6px; }
.gridn td.nm { position: sticky; left: 0; background: var(--card); min-width: 190px; z-index: 1; }
.gridn input.gi { width: 70px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.gridn input.gi.bad { border-color: var(--bad); background: var(--bad-soft); }
.gridn input.go { width: 100%; min-width: 180px; }
.fin { font: 700 16px var(--font); text-align: center; min-width: 52px; }
.fin.low { color: var(--bad); }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.ok > i { background: var(--navy); }
.bar.gold > i { background: var(--navy); }
.bar.low > i { background: var(--bad); }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi b { font: 700 28px/1 var(--font); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.note { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.note.warn { background: var(--warn-soft); }
.note.bad { background: var(--bad-soft); }
.scale { display: inline-flex; gap: 4px; }
.scale button { font-size: 18px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; min-width: 40px; height: 38px; cursor: pointer; font-family: var(--font); color: var(--ink); }
.scale button.on { background: var(--accent-soft); border-color: var(--accent); }
.calw { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cald { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--card); cursor: pointer; min-height: 110px; min-width: 0; }
.cald.hoy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cald b { font: 700 14px var(--font); display: block; margin-bottom: 4px; }
.cmini { font-size: 12.5px; display: flex; gap: 5px; align-items: center; padding: 2px 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.dot.impartida { background: var(--ok); } .dot.cancelada { background: var(--bad); } .dot.cambiada { background: var(--warn); } .dot.pendiente { background: var(--violet); } .dot.sinreg { background: transparent; border: 2px solid #9aa4b8; }
.semg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-items: start; }
.semd { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.semh { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--card); }
.semh.hoy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.semh b { font: 700 15px var(--font); letter-spacing: -0.02em; }
.cel { border: 1px solid var(--line); border-left: 5px solid var(--violet); border-radius: 9px; padding: 6px 8px; background: var(--card); cursor: pointer; min-height: 62px; font-size: 13px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cel b { font: 700 15px var(--font); letter-spacing: -0.02em; }
.cel small { color: var(--muted); font-size: 11.5px; }
.cel .mk { font-weight: 700; }
.cel.e-impartida { border-left-color: var(--ok); } .cel.e-impartida .mk { color: var(--ok); }
.cel.e-cancelada { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad-soft) 40%, var(--card)); } .cel.e-cancelada .mk { color: var(--bad); }
.cel.e-cambiada { border-left-color: var(--warn); } .cel.e-cambiada .mk { color: var(--warn); }
.cel.e-sinreg { border-left-color: #b4bccb; border-style: dashed; border-left-style: solid; } .cel.e-sinreg .mk { color: var(--muted); }
.cel.cont { opacity: .75; }
.cel.sel { box-shadow: 0 0 0 2px var(--accent); }
.cel.hon { background: var(--soft); border-left-color: var(--line); color: var(--muted); cursor: default; }
.rec { height: 24px; line-height: 24px; text-align: center; border-radius: 6px; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.calm { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.calm .h { font-size: 11px; text-align: center; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.calm .d { border: 1px solid var(--line); border-radius: 8px; min-height: 62px; padding: 4px; background: var(--card); cursor: pointer; font-size: 12px; min-width: 0; }
.calm .d.off { background: transparent; border-style: dashed; opacity: .5; cursor: default; }
.calm .d.hoy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.calm .d b { font-size: 13px; }
.dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
.boleta { background: #ffffff; color: #0f1b33; border: 1px solid #2457d6; outline: 1px solid #0f1b33; outline-offset: 3px; border-radius: 2px; padding: 18px 22px; max-width: 640px; margin: 6px auto; font-family: var(--font); }
.boleta h5 { font: 700 21px var(--serif); text-align: center; margin: 0; letter-spacing: .5px; }
.boleta .sub { text-align: center; color: #2457d6; font-size: 10.5px; letter-spacing: .14em; margin: 4px 0 2px; font-weight: 600; }
.boleta .rule { height: 1px; background: #2457d6; margin: 8px 0; }
.boleta table th { background: #0f1b33; color: #fff; text-align: center; border: 0; }
.boleta table td { color: #0f1b33; text-align: center; border-bottom: 1px solid #dfe4ec; }
.boleta table td:first-child { text-align: left; font-weight: 600; }
.boleta { padding: 14px 12px; }
.boleta h5 { font-size: 17px; }
.boleta table { width: 100%; table-layout: fixed; font-size: 11.5px; }
.boleta table th, .boleta table td { padding: 5px 3px; font-size: 11px; }
.boleta table th { text-transform: none; letter-spacing: 0; font-size: 10.5px; }
.boleta table th:first-child, .boleta table td:first-child { width: 34%; }
.boleta .lab { font-size: 9.5px; color: #2457d6; letter-spacing: .12em; font-weight: 700; }
.boleta .obs { background: #eef1f6; border-radius: 6px; padding: 8px 10px; font-size: 13px; min-height: 48px; }
.boleta .firmas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; font-size: 10.5px; text-align: center; }
.boleta .firmas div { border-top: 1px solid #0f1b33; padding-top: 3px; }
#modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(10,12,20,.5); padding: 18px; align-items: center; justify-content: center; }
#modal.on { display: flex; }
#modal .box { background: var(--card); color: var(--ink); border-radius: 14px; padding: 18px; max-width: 420px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow: auto; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
#toast div { background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: 90vw; }
#toast div.bad { background: var(--bad); color: #fff; }
#toast div.ok { background: var(--ok); color: #fff; }
.loading { text-align: center; padding: 40px 10px; color: var(--muted); }
@media (max-width: 620px) {
  .calw, .semg { grid-template-columns: 1fr; }
  .cald { min-height: 0; }
  h1 { font-size: 22px; }
  .hide-s { display: none; }
}

/* ---- estructura de app ---- */
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
header.top { position: sticky; top: 0; z-index: 15; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
main { padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
nav#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav#nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; color: var(--muted); font-size: 10.5px; font-weight: 600; cursor: pointer; border-radius: 10px; user-select: none; }
nav#nav a svg { width: 23px; height: 23px; }
nav#nav a.on { color: var(--accent); }
nav#nav a.only-d { display: none; }
#toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.linkc { display: flex; align-items: center; gap: 14px; cursor: pointer; margin: 0; color: var(--ink); }
.linkc svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.card { border-radius: 14px; }
.btn, .chip, .seg button { transition: background .12s, border-color .12s, transform .06s; }
.btn:active { transform: scale(.98); }
@media (min-width: 900px) {
  body { padding-left: 232px; }
  header.top { display: none; }
  nav#nav { top: 0; right: auto; width: 232px; flex-direction: column; justify-content: flex-start; gap: 2px; border-top: 0; border-right: 1px solid var(--line); padding: 84px 12px 60px; background: var(--card); backdrop-filter: none; }
  nav#nav a { flex: none; flex-direction: row; gap: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500; }
  nav#nav a svg { width: 20px; height: 20px; }
  nav#nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav#nav a:hover { background: var(--soft); }
  nav#nav a.only-d { display: flex; }
  nav#nav a.only-m { display: none; }
  .side-brand { display: flex !important; position: fixed; left: 0; top: 0; width: 232px; z-index: 17; padding: 22px 20px; align-items: center; gap: 10px; }
  .side-sync { display: block !important; position: fixed; left: 16px; bottom: 16px; z-index: 17; }
  main { padding-block: 34px 60px; }
  #toast { bottom: 24px; }
}
.side-brand, .side-sync { display: none; }
header.top h1 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* color por materia: inglés azul, computación lila */
body[data-mat="compu"] { --accent: #6a42c4; --accent-soft: #eee8fb; --ok: #6a42c4; --ok-soft: #eee8fb; --gold: #6a42c4; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 4px; background: var(--accent); z-index: 60; }
.matbar { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--accent); background: var(--accent-soft); padding: 7px 12px; border-radius: 10px; margin-bottom: 12px; }
.matbar i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
body[data-mat="compu"] .seg button.on { background: #6a42c4; color: #fff; }
body[data-mat="ingles"] .seg button.on { background: #2457d6; color: #fff; }
.badge.b-ingles { background: #e6ecfc; color: #2457d6; }
.badge.b-compu { background: #eee8fb; color: #6a42c4; }
/* Hoy y Semana: bloques pastel por materia */
.prepg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 10px 0 14px; }
.pc { display: flex; gap: 12px; border-radius: 12px; padding: 10px 12px; border: 1px solid; }
.pc.m-ingles { background: #eef3fd; border-color: #d6e2f8; }
.pc.m-compu { background: #f3eefb; border-color: #e2d8f4; }
.pc-h { min-width: 50px; } .pc-h b { display: block; font: 700 18px/1.1 var(--font); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; } .pc-h small { color: var(--muted); font-size: 12px; }
.pc-g { font-weight: 700; margin-bottom: 2px; } .pc-t { font-size: 13.5px; margin: 2px 0; }
.matg { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.mcard { border-radius: 12px; padding: 10px 14px; }
.mcard h4 { margin: 0 0 6px; } .mcard ul { margin: 0 0 0 18px; padding: 0; } .mcard li { margin-bottom: 3px; font-size: 13.5px; }
.mcard.imp { background: #f2f5fa; border: 1px solid #dde4f0; } .mcard.obj { background: #faf6ec; border: 1px solid #ede3c8; }
.clsg { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; align-items: start; } .clsg .cls { margin-bottom: 0; }
.cls.m-ingles:not(.e-cancelada) { background: #f4f7fe; }
.cls.m-compu:not(.e-cancelada) { background: #f7f3fd; }
.cel.m-ingles:not(.e-cancelada):not(.e-sinreg) { background: #eef3fd; }
.cel.m-compu:not(.e-cancelada):not(.e-sinreg) { background: #f3eefb; }
.cel.m-ingles.e-sinreg { background: #f6f8fd; } .cel.m-compu.e-sinreg { background: #f8f5fd; }
@media (max-width: 640px) { .tmae th { white-space: normal; letter-spacing: 0; font-size: 10.5px; line-height: 1.2; padding: 6px 4px; } .tmae td { padding: 8px 4px; font-size: 14px; } .tmae td:first-child { width: 34%; } .tmae .badge { font-size: 10.5px; padding: 2px 6px; white-space: normal; } }
.nw { white-space: nowrap; }
.badge.fav { background: #eee8fb; color: #6a42c4; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mark">L</div><div><h1>Libreta de Clases</h1><p id="sub">Inglés y Computación</p></div></div>
